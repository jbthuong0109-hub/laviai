<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký thẻ thành viên - Món Nghệ</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Be Vietnam Pro', sans-serif;
      min-height: 100vh;
      background: #f5f6f8;
      display: flex;
      align-items: center;
      padding: 2rem 0;
    }
    .card-dk {
      border: 1px solid #e5e7eb;
      border-radius: .75rem;
      box-shadow: 0 2px 10px rgba(0, 0, 0, .05);
    }
    .banner { padding: 2rem 2rem 0; }
    .banner h1 { font-size: 1.5rem; font-weight: 700; margin: 0; color: #111; }
    .banner p { color: #6b7280; margin: .35rem 0 0; font-size: .95rem; }
    .form-label { font-weight: 500; color: #333; }
    .form-control { padding: .6rem .9rem; }
    .btn-dk { padding: .65rem; font-weight: 600; }
  </style>
</head>
<body>
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-7 col-lg-5">
        <div class="card card-dk">
          <div class="banner">
            <h1>Đăng ký thẻ thành viên</h1>
            <p>Nhận ưu đãi độc quyền từ Món Nghệ</p>
          </div>
          <div class="card-body p-4">
            <div id="thongBao" class="alert alert-success d-none"></div>

            <form id="formDangKy" novalidate>
              <div class="mb-3">
                <label for="hoTen" class="form-label">Họ và tên</label>
                <input type="text" class="form-control" id="hoTen" placeholder="Nguyễn Văn Nam">
                <div class="invalid-feedback">Họ tên không được để trống và tối thiểu 3 ký tự.</div>
              </div>
              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="text" class="form-control" id="email" placeholder="ban@example.com">
                <div class="invalid-feedback">Email không đúng định dạng.</div>
              </div>
              <div class="mb-3">
                <label for="soDienThoai" class="form-label">Số điện thoại</label>
                <input type="text" class="form-control" id="soDienThoai" placeholder="0912345678">
                <div class="invalid-feedback">Số điện thoại phải gồm đúng 10 chữ số và bắt đầu bằng số 0.</div>
              </div>
              <div class="mb-4">
                <label for="soKhach" class="form-label">Số khách thường đi cùng</label>
                <input type="text" class="form-control" id="soKhach" placeholder="0 - 20">
                <div class="invalid-feedback">Số khách phải là số nguyên từ 0 đến 20.</div>
              </div>
              <button type="submit" class="btn btn-danger btn-dk w-100">Đăng ký ngay</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('formDangKy');
    const thongBao = document.getElementById('thongBao');

    function danhDau(input, hopLe) {
      if (hopLe) input.classList.remove('is-invalid');
      else input.classList.add('is-invalid');
      return hopLe;
    }

    form.addEventListener('submit', function (event) {
      event.preventDefault();
      thongBao.classList.add('d-none');

      const hoTenInput = document.getElementById('hoTen');
      const emailInput = document.getElementById('email');
      const sdtInput = document.getElementById('soDienThoai');
      const soKhachInput = document.getElementById('soKhach');

      const hoTen = hoTenInput.value.trim();
      const email = emailInput.value.trim();
      const sdt = sdtInput.value.trim();
      const soKhach = soKhachInput.value.trim();

      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      const sdtRegex = /^0\d{9}$/;

      // Kiểm tra tất cả, không dừng ở lỗi đầu tiên
      const ok1 = danhDau(hoTenInput, hoTen.length >= 3);
      const ok2 = danhDau(emailInput, emailRegex.test(email));
      const ok3 = danhDau(sdtInput, sdtRegex.test(sdt));
      const ok4 = danhDau(soKhachInput, /^\d+$/.test(soKhach) && Number(soKhach) >= 0 && Number(soKhach) <= 20);

      if (ok1 && ok2 && ok3 && ok4) {
        thongBao.textContent = `Cảm ơn ${hoTen} đã đăng ký thẻ thành viên Món Nghệ!`;
        thongBao.classList.remove('d-none');
        form.reset();
      }
    });
  </script>
</body>
</html>
